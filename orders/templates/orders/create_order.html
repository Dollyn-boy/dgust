<!-- orders/create_order.html -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Novo Pedido</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 90%;
            width: 400px;
        }
        .messages {
            list-style: none;
            padding: 0;
            margin-bottom: 1.5rem;
        }
        .messages li {
            padding: 0.75rem;
            border-radius: 0.5rem;
            margin-bottom: 0.75rem;
            font-weight: 500;
        }
        .messages .success {
            background-color: #d1fae5;
            color: #065f46;
        }
        .messages .info {
            background-color: #dbeafe;
            color: #1e40af;
        }
        .messages .warning {
            background-color: #fffbeb;
            color: #92400e;
        }
        .messages .error {
            background-color: #fee2e2;
            color: #991b1b;
        }
        .btn {
            background-color: #4f46e5;
            color: #ffffff;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            font-weight: 600;
            transition: background-color 0.3s ease;
            cursor: pointer;
            border: none;
            display: inline-block;
            text-decoration: none;
        }
        .btn:hover {
            background-color: #4338ca;
        }
        .link {
            color: #4f46e5;
            text-decoration: none;
            font-weight: 500;
            margin-top: 1rem;
            display: block;
        }
        .link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-3xl font-bold text-gray-800 mb-4">Seu Pedido</h1>

        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li class="{{ message.tags }}">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        <p class="text-gray-600 mb-6">Clique no botão abaixo para iniciar um novo carrinho de compras.</p>

        <form method="post" action="{% url 'create_order' %}" class="mb-4">
            {% csrf_token %}
            <button type="submit" class="btn">Iniciar Novo Pedido</button>
        </form>

        <a href="{% url 'order_history' %}" class="link">Ver meu histórico de pedidos</a>
    </div>
</body>
</html>
